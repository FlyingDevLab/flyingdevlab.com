<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no でゲーム中のピンチズームを無効化する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- ===== SEO：ページタイトル・説明 ===== -->
  <title>MAKE10 – 30-Second Challenge / 30秒チャレンジ – Mental Math Game</title>
  <meta name="description" content="How many can you solve in 30 seconds? Pick the number that adds up to 10 and build combos for time bonuses. 30秒で「足して10」を何問解けるか！コンボでタイムボーナス獲得の暗算ブラウザゲーム。">

  <!-- ===== OGP：SNS シェア用メタタグ ===== -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="MAKE10 – 30-Second Challenge / 30秒チャレンジ">
  <meta property="og:description" content="How many can you solve in 30 seconds? Build combos for time bonuses. 30秒で「足して10」を何問解けるか！コンボでタイムボーナス獲得。">
  <meta property="og:url"         content="https://flyingdevlab.com/make10/">
  <meta property="og:site_name"   content="Flying Dev Lab">
  <meta name="twitter:card"       content="summary">
  <meta name="twitter:title"      content="MAKE10 – 30-Second Challenge / 30秒チャレンジ">
  <meta name="twitter:description" content="How many can you solve in 30 seconds? / 30秒で「足して10」を何問解けるか！">

  <!-- ===== フォント =====
       変更: Google Fonts（Nunito）への外部リンク（preconnect ×2 ＋ css2 読み込み）を削除。
       理由: 子ども向けページからの外部リクエストをゼロにするため。
             Nunito（400 / 700 / 900）は style.css の @font-face により
             /fonts/ の woff2 を自己ホスト済みで、見た目は従来どおり。 -->

  <!-- ===== スタイルシート ===== -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- アニメーションする背景の光球（装飾のみ・スクリーンリーダーには読み上げさせない） -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <!-- ===== ヘッダー：全画面共通のゲームタイトルバー ===== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1 class="site-title">
        <!-- [FIX] title-num → title-accent に修正（CSS クラス名の不一致を解消） -->
        MAKE<span class="title-accent">10</span>
      </h1>
      <p class="site-tagline">30-SECOND CHALLENGE</p>
    </div>
  </header>

  <!-- ===== メインコンテンツ：3つの画面を切り替えて表示 ===== -->
  <main id="main-content" role="main">

    <!-- ゲーム全体のコンテナ（各画面を内包する） -->
    <div class="game-container" id="gameContainer">

      <!-- ── トップ画面：ゲーム説明・ハイスコア・スタートボタン ── -->
      <section class="screen active" id="screen-top" aria-label="Title Screen / タイトル画面">
        <div class="glass-card" style="text-align:center;">

          <!-- ゲームルール見出し -->
          <h2 class="rule-heading" id="rule-heading">How to Play&ensp;/&ensp;<span lang="ja">あそびかた</span></h2>

          <!-- ゲームルール説明 -->
          <p class="title-rule">
            Pick the number that adds up to <strong>10</strong>!<br>
            <span class="tip-ja" lang="ja">数字を足して <strong>10</strong> にしよう！</span>
          </p>

          <!-- ハイスコア表示（JS で値を注入。スコアがない場合は空） -->
          <div
            class="title-hi"
            id="titleHi"
            aria-live="polite"
            aria-label="Best score"
          ></div>

          <!-- スタートボタン -->
          <button
            class="btn btn-primary"
            id="btn-start"
            style="width:100%;"
            aria-label="Start the game"
          >
            🚀 START&ensp;/&ensp;<span lang="ja">スタート</span>
          </button>
        </div>
      </section><!-- /#screen-top -->

      <!-- ── ゲーム画面：実際のゲームプレイ ── -->
      <section class="screen" id="screen-game" aria-label="Game Screen / ゲームプレイ画面">

        <!-- ヘッダー行：ホームボタン・スコア・コンボ表示 -->
        <div class="play-header">
          <div class="score-display" aria-label="Score">
            SCORE <span id="scoreValue" aria-live="polite">0</span>
          </div>
          <div
            class="combo-display"
            id="comboDisplay"
            aria-live="polite"
            aria-label="Combo"
          ></div>
        </div>

        <!-- タイムゲージ：残り時間を割合で表示する -->
        <div
          class="gauge-wrapper"
          role="progressbar"
          aria-label="Time remaining"
          aria-valuemin="0"
          aria-valuemax="30"
          aria-valuenow="30"
          id="gaugeWrapper"
        >
          <div class="gauge-bar" id="gaugeBar" style="width:100%;"></div>
        </div>

        <!-- 問題エリア：現在の数字・ヒント・次の数字プレビューを表示する -->
        <div class="question-area" id="questionArea" aria-label="Question">
          <div class="question-card">
            <div class="question-label">MAKE 10!</div>
            <div
              class="question-number"
              id="questionNumber"
              aria-live="assertive"
              aria-label="Current number"
            >5</div>
            <div class="question-hint">
              <span id="questionPlus" aria-hidden="true">5</span> + ? = 10
            </div>
            <!-- 次の問題の数字をプレビュー表示してプレイヤーに予告する -->
            <div class="next-label" aria-hidden="true">NEXT</div>
            <div class="next-number" id="nextNumber" aria-hidden="true"></div>
          </div>
        </div>

        <!-- 選択肢タイル：JS で動的に生成される -->
        <div
          class="tiles-grid"
          id="tilesGrid"
          role="group"
          aria-label="Choose your answer"
        ></div>

      </section><!-- /#screen-game -->

      <!-- ── リザルト画面：スコア・ハイスコア・ボタン ── -->
      <section
        class="screen"
        id="screen-result"
        aria-label="Result Screen / リザルト画面"
        aria-live="assertive"
      >
        <div class="glass-card" style="text-align:center;">

          <!-- スコア表示 -->
          <p class="result-score-label">YOUR SCORE</p>
          <div class="result-score" id="resultScore" aria-label="Your score">0</div>

          <!-- ハイスコア表示（新記録時は JS でスタイルを切り替える） -->
          <div class="result-hi" id="resultHi" aria-live="polite"></div>

          <!-- スコアに応じたメッセージ -->
          <h2 class="result-message" id="resultMessage" aria-live="polite">Try again!</h2>

          <!-- 最大コンボ数 -->
          <p class="result-combo" id="resultCombo" aria-live="polite"></p>

          <!-- ボタン群 -->
          <div class="result-buttons" role="group" aria-label="After the game">
            <button
              class="btn btn-primary"
              id="btn-retry"
              style="width:100%;"
              aria-label="Play again"
            >
              🔄 Retry&ensp;/&ensp;<span lang="ja">もう一度</span>
            </button>
            <!-- App Store への導線は置かない。
                 /kids/ 配下はこども向け領域として外部リンクを一切置かない方針。
                 以前ここにコメントアウトされたボタンが残っていたが、
                 「解除すれば出せる」という誘導が方針と矛盾するため削除した。 -->
            <button
              class="btn btn-secondary"
              id="btn-top"
              style="width:100%;"
              aria-label="Back to title"
            >
              ← Title&ensp;/&ensp;<span lang="ja">タイトルへ</span>
            </button>
          </div>
        </div>
      </section><!-- /#screen-result -->

    </div><!-- /.game-container -->
  </main><!-- /#main-content -->

  <!-- ===== フッター：全画面共通のコピーライト ===== -->
  <footer class="site-footer" role="contentinfo">
    <!-- 戻り導線。行き先は /kids/ のハブまでで、そこから先には出られない。
         こども向け領域の外（TOP・SNS・App Store など）へは繋がない方針。 -->
    <p class="footer-copy">
      <a href="/kids/" class="footer-link">&larr; Playing Dev Lab&ensp;/&ensp;<span lang="ja">遊びの研究室</span></a>
    </p>
    <!-- 変更: 著作権表示からリンクを外した。
         旧: 「Flying Dev Lab」の文字が https://flyingdevlab.com への
             リンク（target="_blank"）になっていた。
         理由: そのリンクを辿るとSNS埋め込みのあるTOPに到達できてしまい、
               こども向け領域を袋小路にするという方針と矛盾するため。
               著作権は表示する。ただしそこから移動はできない。 -->
    <p class="footer-copy">
      &copy; <time datetime="2026">2026</time> Flying Dev Lab. All rights reserved.
    </p>
  </footer>

  <!-- ===== ゲームロジック（body 末尾で読み込み） ===== -->
  <script src="game.js"></script>
</body>
</html>
