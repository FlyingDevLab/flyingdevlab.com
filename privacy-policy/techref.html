  <!--
  ============================================================
  【設計メモ: プライバシーポリシー & 免責事項（TechRef）】

  ■ 1ファイル完結
    MAKE10 / PriceWise と同じ方針。アクセスはほぼ100%アプリ内リンク経由のため、
    hreflang などの SEO 設定は割り切る。翻訳の追加・修正・デプロイが1ファイルで完結する。

    Settings からのリンクは2つだが、ファイルは1つ：
      Privacy Policy → techref.html
      Disclaimer     → techref.html#disclaimer

  ■ 翻訳データの持ち方：「id付き配列型」（PriceWise の配列型の改良版）
    T[言語].sections[] = { id, title, html } の配列。
    PriceWise の純粋な配列型はインデックス依存のため、ある言語だけセクション数が
    ずれると表示が崩れる。こちらは id で解決するので崩れない。

    描画は「英語版の配列」を基準にループし、選択言語に同じ id があればそれを使い、
    無ければ英語版で埋める（＝英語フォールバック）。
    → 25言語に増やす際、全訳が揃う前でも順次デプロイできる。
    → セクション番号は配列の並び順から自動採番するので、手で振り直す必要がない。

  ■ デフォルト言語は英語
    アプリ本体が英語のため、英語をマスターとする。
    MAKE10 は毎回ブラウザ言語で判定、PriceWise は localStorage に保存。
    こちらは PriceWise 方式（localStorage: "tr-lang"）を採用。25言語対応時に有用。

  ■ フォント：外部リクエストゼロ
    MAKE10 は Nunito を自己ホストしているが、TechRef はシステムフォントのみで完結。
    woff2 ファイルすら不要で、HTTPリクエストは HTML 1本だけになる。
    多言語化の際も OS 側が適切なフォントを選ぶため、25言語対応にむしろ強い。

  ■ 発効日
    ページ公開日を記載する。更新のたびに全言語の meta.updatedDate を変更すること。
  ============================================================
  -->

/*
 * LANG_MAP
 * ─────────────────────────────────────────────
 * navigator.languages が返す値（"en-US", "ja-JP" など）を
 * 翻訳データのキーに変換する対応表。
 * 言語を追加するときは、この表にも該当のロケールを追加すること。
 */
const LANG_MAP = {
  "en": "en", "en-US": "en", "en-GB": "en", "en-AU": "en", "en-CA": "en",
  "ja": "ja"
};
const SUPPORTED = Object.keys(T);
const DEFAULT_LANG = "en";   // ★ アプリ本体が英語のため、英語をデフォルトとする
const STORAGE_KEY = "tr-lang";

/*
 * detectLang()
 * ─────────────────────────────────────────────
 * 表示言語を自動検出する。優先順位：
 *   1. localStorage の "tr-lang"（ユーザーが選んだ言語を記憶）
 *   2. navigator.languages を上から順に LANG_MAP で照合
 *   3. どれも一致しなければ "en"
 */
function detectLang() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && SUPPORTED.includes(saved)) return saved;
  } catch (e) {
    // プライベートブラウズ等で localStorage が使えない場合は無視して続行
  }
  const navLangs = navigator.languages || [navigator.language || DEFAULT_LANG];
  for (const l of navLangs) {
    const code = LANG_MAP[l] || LANG_MAP[l.split("-")[0]];
    if (code && SUPPORTED.includes(code)) return code;
  }
  return DEFAULT_LANG;
}

/*
 * renderSection(section, index)
 * ─────────────────────────────────────────────
 * セクション1つ分のカード HTML を組み立てて返す。
 * 番号は配列のインデックスから自動採番（index + 1）。
 * id は英語版のものを使うため、アンカー（#disclaimer）は言語を切り替えても有効。
 *
 * ⚠️ XSS 注意：html を innerHTML で直接挿入している。
 *    翻訳データは開発者が管理する固定テキストのため問題ないが、
 *    ユーザー入力を混ぜる場合は必ずエスケープすること。
 */
function renderSection(section, index) {
  const num = String(index + 1);
  return `<section class="policy-section" id="${section.id}">
    <h2><span class="sec-num">${num}</span><span>${section.title}</span></h2>
    ${section.html}
  </section>`;
}

/*
 * renderAll(lang)
 * ─────────────────────────────────────────────
 * ★ 英語フォールバックの中核。
 *
 * 英語版の sections を「正」としてループし、各 id について
 * 選択言語に同じ id があればそれを、無ければ英語版を使う。
 * これにより：
 *   - 翻訳が未完成の言語でも空欄にならない
 *   - セクションの数・順序・番号が言語をまたいで常に一致する
 *   - 25言語に増やす際、全訳を待たずに順次公開できる
 */
function renderAll(lang) {
  const master = T[DEFAULT_LANG].sections;
  const localized = T[lang] ? T[lang].sections : [];
  const byId = {};
  localized.forEach(s => { byId[s.id] = s; });

  return master.map((masterSection, i) => {
    const s = byId[masterSection.id] || masterSection;
    // id は必ず英語版（＝マスター）のものを使い、アンカーを固定する
    return renderSection({ id: masterSection.id, title: s.title, html: s.html }, i);
  }).join("");
}

/*
 * applyLang(code, save)
 * ─────────────────────────────────────────────
 * ページ全体の表示言語を切り替える。
 * @param {string}  code - 言語コード（"en" / "ja" …）
 * @param {boolean} save - true のとき localStorage に保存する
 *                         （初回の自動検出時は false、ユーザー操作時は true）
 */
function applyLang(code, save) {
  if (!SUPPORTED.includes(code)) code = DEFAULT_LANG;
  const meta = T[code].meta;

  document.documentElement.lang = code;
  document.getElementById("hd-title").textContent   = meta.pageTitle;
  document.getElementById("hd-sub").textContent     = meta.subtitle;
  document.getElementById("hd-updated").textContent = meta.updatedLabel + ": " + meta.updatedDate;
  document.getElementById("lang-label").textContent = meta.selectLabel + ":";
  document.getElementById("ls").value               = code;
  document.getElementById("content").innerHTML      = renderAll(code);
  document.title = meta.pageTitle + " – TechRef";

  // フッター（aria-label と法的リンク・著作権表記を表示言語に追従させる）
  const f = meta.footer;
  document.getElementById("f-github").setAttribute("aria-label", f.ariaGithub);
  document.getElementById("f-x").setAttribute("aria-label", f.ariaX);
  document.getElementById("f-ig").setAttribute("aria-label", f.ariaInstagram);
  document.getElementById("f-top").setAttribute("aria-label", f.ariaTop);
  const legal = document.getElementById("f-legal");
  legal.setAttribute("aria-label", f.ariaLegal);
  legal.innerHTML = f.legalHtml;
  // 法的リンクが無い言語（英語など）では、区切り線ごと非表示にする
  legal.style.display = f.legalHtml ? "" : "none";
  document.getElementById("f-copy").innerHTML = f.copyHtml;

  if (save) {
    try { localStorage.setItem(STORAGE_KEY, code); } catch (e) { /* 保存できなくても続行 */ }
  }

  // #disclaimer 等のアンカー付きで開かれた場合、描画後に改めてスクロールする
  if (location.hash) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
}

applyLang(detectLang(), false);
