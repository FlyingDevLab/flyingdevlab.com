# ================================================================
#  no-external-links.yml ― /kids/ 配下に外部URLが混入していないか検査する
# ================================================================
#
#  ■ なぜこの検査が必要なのか
#    こども向け領域（/kids/）には「外部リンクを置かない」という方針がある。
#    しかし、この方針だけは _headers の CSP では守れない。
#
#      CSP が止めるのは「読み込み」であって「遷移」ではない。
#      <script src="https://..."> は CSP が拒否するが、
#      <a href="https://..."> は CSP の管轄外で、普通に機能してしまう。
#
#    つまり「広告なし・課金なし・外部送信なし」の3つはヘッダーが
#    構造的に保証するが、「外部リンクなし」だけは人の注意力に頼っている。
#    その1つを機械に担当させるのが、このワークフローである。
#
#  ■ 何を守るのか（守れないもの）
#    守れるのは「flyingdevlab.com として公開される経路」だけである。
#    誰かがこのリポジトリをクローンした先までは縛れない。
#    fork された場合、GitHub は既定で fork 側の Actions を無効にするし、
#    有効化されても結果はその人の手元に出るだけである。
#    このファイルは「自分が将来うっかりやること」を止めるための仕掛けであって、
#    他人のコピーを制限するものではない。
#
#  ■ 検査の対象
#    kids/ 配下の .html / .css / .js のみ。
#    ブラウザが解釈して実行するファイルに絞っている。
#    readme.md は開発メモであり、こどもがクリックできるリンクではないため除外。
#
#  ■ コメントアウトされた外部URLも検出する（意図的）
#    「解除すれば出せる」状態のコメントは、将来の自分に対する誘導になる。
#    実際、ten-puzzle には App Store ボタンがコメントアウトで用意され、
#    readme には「有効化する」と書かれていた。
#    そのため、コメントの中であっても外部URLがあれば失敗させる。
#
#  ■ 除外している2つのドメイン
#    flyingdevlab.com … 自サイト。canonical と og:url が絶対URLを要求するため
#                       書かざるを得ない。これらはリンクではなくメタ情報。
#    www.w3.org       … SVG の名前空間宣言（xmlns="http://www.w3.org/2000/svg"）。
#                       接続先ではなく、XML の規格上の識別子である。
#
#  ■ 失敗したときの直し方
#    検出された行をそのまま消すか、リンクを使わない形に書き換える。
#    「ここだけ例外にしたい」と思ったときは、その前に
#    /kids/ を袋小路にした理由（こどもを外部サイトへ出さない）を
#    思い出すこと。例外を1つ認めると、その時点で保証が終わる。
# ================================================================

name: /kids/ に外部リンクが無いことを確認する

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v5

      - name: kids/ 配下の html・css・js から外部URLを探す
        run: |
          # grep は1件も見つからないと終了コード1を返す。
          # ここでは「見つからない」のが正常なので、|| true で失敗を打ち消し、
          # 結果が空かどうかで自前で判定する。
          hits=$(grep -rnoE "https?://[^\"' )]+" \
                   --include='*.html' --include='*.css' --include='*.js' \
                   kids/ \
                 | grep -vE "https?://(flyingdevlab\.com|www\.w3\.org)" || true)

          if [ -n "$hits" ]; then
            echo "::error::kids/ 配下に外部URLが見つかりました。"
            echo ""
            echo "$hits"
            echo ""
            echo "こども向け領域は外部リンクを置かない方針です。"
            echo "詳しい理由は .github/workflows/no-external-links.yml の冒頭を読んでください。"
            exit 1
          fi

          echo "外部URLはありません。"
